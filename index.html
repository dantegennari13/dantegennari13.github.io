<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Dante Gennari</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Dante Gennari · Gestión de proyectos logísticos SAP, desarrollo de aplicaciones y comunicación. Madrid.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: la foto cortada en cinco franjas verticales que hacen de menú; la franja pulsada abre su panel justo debajo. */
:root{
  --bg:#F3F5F8;
  --surface:#FFFFFF;
  --surface-2:#EDF1F6;
  --ink:#0B1A30;
  --muted:#5B6B82;
  --line:#DCE3EC;
  --brand:#0B4FA8;
  --brand-ink:#FFFFFF;
  --brand-soft:#E3EDFA;
  --navy:#0B1A30;
  --navy-ink:#E9EFF8;
  --ok:#0F7B55;
  --ok-soft:#DDF3EA;
  --gap:6px;
  --shadow:0 1px 2px rgba(11,26,48,.05), 0 10px 30px rgba(11,26,48,.08);
  --f-sans:"Plus Jakarta Sans", "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A111C; --surface:#111A28; --surface-2:#172235; --ink:#E8EEF7; --muted:#93A3BA; --line:#223047;
    --brand:#5B9BF0; --brand-ink:#06101F; --brand-soft:#16294A; --navy:#13213A; --navy-ink:#E9EFF8;
    --ok:#4CC995; --ok-soft:#10301F; --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A111C; --surface:#111A28; --surface-2:#172235; --ink:#E8EEF7; --muted:#93A3BA; --line:#223047;
  --brand:#5B9BF0; --brand-ink:#06101F; --brand-soft:#16294A; --navy:#13213A; --navy-ink:#E9EFF8;
  --ok:#4CC995; --ok-soft:#10301F; --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bg); color:var(--ink); font-family:var(--f-sans); font-size:1rem; line-height:1.6; -webkit-font-smoothing:antialiased}
.wrap{max-width:72rem; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand); outline-offset:3px; border-radius:6px}
h1,h2,h3{margin:0; line-height:1.15; text-wrap:balance}
p{margin:0}

/* ---------- Cabecera ---------- */
.top{padding-block:1.5rem 1.25rem}
.top .wrap{display:flex; flex-wrap:wrap; align-items:end; justify-content:space-between; gap:1rem 2rem}
.top h1{font-size:clamp(2.1rem, 5.5vw, 3.6rem); font-weight:800; letter-spacing:-.035em}
.role{margin-top:.4rem; font-size:clamp(1rem, 2vw, 1.2rem); font-weight:600; color:var(--muted); min-height:1.6em}
.role .rot{color:var(--brand)}
.caret{display:inline-block; width:2px; height:1.05em; background:var(--brand); vertical-align:-.12em; margin-left:2px; animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.actions{display:flex; gap:.5rem; align-items:center}
.btn{display:inline-flex; align-items:center; gap:.5rem; padding:.7rem 1.1rem; border-radius:10px; font:600 .92rem/1 var(--f-sans); text-decoration:none; cursor:pointer; border:1px solid var(--line); background:var(--surface); color:var(--ink); white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn svg{width:16px; height:16px}
.btn-primary{background:var(--brand); color:var(--brand-ink); border-color:var(--brand)}
.btn-primary:hover{border-color:var(--brand); filter:brightness(1.08)}
.icon-btn{width:40px; height:40px; padding:0; justify-content:center}
.hint{font-size:.85rem; color:var(--muted); display:flex; align-items:center; gap:.5rem; margin-top:1rem}
.hint svg{width:16px; height:16px; color:var(--brand)}

/* ---------- Franjas de la foto ---------- */
.stage{position:relative; display:flex; gap:var(--gap); height:clamp(380px, 56vw, 620px); user-select:none}
.strip{
  position:relative; flex:1 1 0; min-width:0; overflow:hidden; border:0; padding:0; margin:0; cursor:pointer;
  background:var(--surface-2); border-radius:10px; color:#fff; font:inherit; text-align:left;
  transition:transform .45s cubic-bezier(.2,.8,.2,1), filter .35s, box-shadow .35s;
}
.strip img{position:absolute; top:0; height:100%; max-width:none; object-fit:cover; object-position:50% 30%; pointer-events:none; transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.strip::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,18,34,0) 45%, rgba(8,18,34,.78) 100%); transition:background .35s}
.stage.has-active .strip:not(.active){filter:grayscale(.85) brightness(.72)}
.stage.has-active .strip:not(.active):hover{filter:grayscale(.3) brightness(.92)}
.strip.active{transform:translateY(-10px); box-shadow:0 22px 40px -18px rgba(11,26,48,.6)}
.strip.active::after{background:linear-gradient(180deg, rgba(11,79,168,0) 40%, rgba(11,79,168,.85) 100%)}
.strip:hover img{transform:scale(1.03)}
.strip .label{
  position:absolute; z-index:2; left:50%; bottom:1.1rem; transform:translateX(-50%) rotate(180deg);
  writing-mode:vertical-rl; font-weight:700; font-size:clamp(.95rem, 1.8vw, 1.25rem); letter-spacing:-.01em; white-space:nowrap; text-shadow:0 1px 8px rgba(0,0,0,.35)
}
.strip .kick{position:absolute; z-index:2; top:.85rem; left:50%; transform:translateX(-50%); font-family:var(--f-mono); font-size:.68rem; letter-spacing:.12em; opacity:.85; text-transform:uppercase}
.strip .bar{position:absolute; z-index:2; left:0; right:0; bottom:0; height:4px; background:#fff; transform:scaleX(0); transition:transform .4s}
.strip.active .bar{transform:scaleX(1)}

@media (prefers-reduced-motion:no-preference){
  .stage.intro .strip{animation:cut .9s cubic-bezier(.2,.8,.2,1) both}
  .stage.intro .strip:nth-child(odd){--from:-26px}
  .stage.intro .strip:nth-child(even){--from:26px}
  .stage.intro .strip:nth-child(1){animation-delay:.05s}
  .stage.intro .strip:nth-child(2){animation-delay:.12s}
  .stage.intro .strip:nth-child(3){animation-delay:.19s}
  .stage.intro .strip:nth-child(4){animation-delay:.26s}
  .stage.intro .strip:nth-child(5){animation-delay:.33s}
  @keyframes cut{from{transform:translateY(var(--from))}}
}

/* ---------- Panel ---------- */
.panel-wrap{position:relative; margin-top:18px; padding-bottom:3rem}
.notch{position:absolute; top:-9px; width:18px; height:18px; background:var(--surface); border-left:1px solid var(--line); border-top:1px solid var(--line); transform:translateX(-50%) rotate(45deg); transition:left .45s cubic-bezier(.2,.8,.2,1); z-index:2}
.panel{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:clamp(1.5rem, 4vw, 2.75rem); min-height:16rem}
.panel-inner{transition:opacity .2s, transform .2s}
.panel-inner.out{opacity:0; transform:translateY(8px)}
.p-head{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:end; gap:1rem; margin-bottom:1.75rem}
.kicker{font-family:var(--f-mono); font-size:.76rem; letter-spacing:.12em; text-transform:uppercase; color:var(--brand); font-weight:500}
.p-head h2{font-size:clamp(1.6rem, 3.4vw, 2.3rem); font-weight:800; letter-spacing:-.03em; margin-top:.4rem}
.pager{display:flex; gap:.4rem}

/* Quién soy */
.who{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:clamp(1.5rem, 4vw, 3rem)}
.who .txt p{font-size:1.05rem; margin-bottom:1rem; max-width:60ch}
.who .txt p:last-child{color:var(--muted); margin-bottom:0}
.caps{display:grid; gap:.75rem}
.cap{display:grid; grid-template-columns:auto minmax(0,1fr); gap:.9rem; padding:1.1rem; border:1px solid var(--line); border-radius:14px; background:var(--bg)}
.cap .ic{width:40px; height:40px; border-radius:11px; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center}
.cap .ic svg{width:20px; height:20px}
.cap h3{font-size:1rem; font-weight:700}
.cap p{color:var(--muted); font-size:.92rem; margin-top:.2rem}
.stats{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); border-top:1px solid var(--line); margin-top:2rem; padding-top:1.5rem; gap:1rem}
.stat .num{font-size:clamp(1.7rem, 3vw, 2.2rem); font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.stat .num sup{font-size:.55em; color:var(--brand); vertical-align:.6em}
.stat .lbl{color:var(--muted); font-size:.85rem}

/* Experiencia */
.filters{display:flex; flex-wrap:wrap; gap:.4rem}
.chip-btn{padding:.45rem .9rem; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font:600 .84rem/1 var(--f-sans); cursor:pointer}
.chip-btn:hover{color:var(--ink); border-color:var(--ink)}
.chip-btn[aria-pressed="true"]{background:var(--navy); color:var(--navy-ink); border-color:var(--navy)}
.jobs{list-style:none; margin:0; padding:0; display:grid; gap:.75rem}
.job{display:grid; grid-template-columns:10rem minmax(0,1fr); gap:1.25rem; padding:1.25rem 1.4rem; border:1px solid var(--line); border-radius:14px; background:var(--bg)}
.job[hidden]{display:none}
.when{font-family:var(--f-mono); font-size:.84rem; color:var(--muted); font-variant-numeric:tabular-nums; padding-top:.15rem}
.when span{display:block; font-family:var(--f-sans); font-size:.8rem; margin-top:.25rem}
.job h3{font-size:1.1rem; font-weight:700}
.org{color:var(--brand); font-weight:600; font-size:.94rem; margin-top:.15rem}
.job ul{margin:.6rem 0 0; padding-left:1.1rem; color:var(--muted)}
.job li{margin:.2rem 0}
.job li::marker{color:var(--brand)}
.status{display:inline-flex; align-items:center; gap:.4rem; font-size:.72rem; font-weight:700; padding:.22rem .55rem; border-radius:999px; background:var(--ok-soft); color:var(--ok); margin-left:.4rem; vertical-align:middle}
.status::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}

/* Formación */
.edu-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:.75rem}
.edu{padding:1.25rem 1.4rem; border:1px solid var(--line); border-radius:14px; background:var(--bg); display:flex; flex-direction:column; gap:.3rem}
.edu .yr{font-family:var(--f-mono); font-size:.8rem; color:var(--muted)}
.edu h3{font-size:1.04rem; font-weight:700}
.edu .inst{color:var(--muted); font-size:.92rem}
.edu.featured{grid-column:1 / -1; background:var(--navy); border-color:var(--navy); color:var(--navy-ink); padding:1.75rem}
.edu.featured .yr,.edu.featured .inst{color:color-mix(in srgb, var(--navy-ink) 70%, transparent)}
.edu.featured h3{font-size:1.35rem}
.progress{margin-top:1rem; max-width:30rem}
.progress .track{height:8px; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden}
.progress .fill{height:100%; width:0; background:linear-gradient(90deg, #5B9BF0, #8FC0FF); border-radius:inherit; transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.progress .row{display:flex; justify-content:space-between; font-family:var(--f-mono); font-size:.76rem; margin-top:.45rem; color:color-mix(in srgb, var(--navy-ink) 70%, transparent)}

/* Competencias */
.skills{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:1.25rem}
.skills > *{min-width:0}
.grp + .grp{margin-top:1.5rem}
.grp h3{font-size:1rem; font-weight:700}
.chips{list-style:none; padding:0; margin:.75rem 0 0; display:flex; flex-wrap:wrap; gap:.45rem}
.chips li{padding:.45rem .8rem; border-radius:8px; border:1px solid var(--line); background:var(--bg); font-size:.88rem; font-weight:500; max-width:100%; overflow-wrap:anywhere}
.chips.brand li{background:var(--brand-soft); border-color:transparent}
.langs{padding:1.4rem; border:1px solid var(--line); border-radius:14px; background:var(--bg)}
.lang + .lang{margin-top:1.1rem}
.lang .row{display:flex; justify-content:space-between; font-weight:600; font-size:.95rem}
.lang .row span:last-child{color:var(--muted); font-weight:500; font-size:.86rem}
.lang .track{height:6px; border-radius:99px; background:var(--surface-2); margin-top:.45rem; overflow:hidden}
.lang .fill{height:100%; width:0; background:var(--brand); border-radius:inherit; transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* Contacto */
.contact{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1.5rem; align-items:center}
.contact p.lead{font-size:1.08rem; color:var(--muted); max-width:44ch}
.clist{display:grid; gap:.65rem}
.cline{display:flex; align-items:center; gap:.85rem; padding:.9rem 1rem; border-radius:14px; border:1px solid var(--line); background:var(--bg); color:var(--ink); text-decoration:none; min-width:0}
a.cline:hover{border-color:var(--brand)}
.cline .ic{width:38px; height:38px; border-radius:10px; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; flex:none}
.cline .ic svg{width:18px; height:18px}
.cline .t{min-width:0; flex:1}
.cline small{display:block; font-size:.75rem; color:var(--muted)}
.cline b{display:block; font-weight:600; overflow-wrap:anywhere}
.cline b.sel{user-select:all}
.contact{align-items:start}
.cform{display:grid; gap:.9rem}
.cform label{display:grid; gap:.35rem; font-size:.85rem; font-weight:600; color:var(--muted)}
.cform input, .cform textarea{font:400 1rem/1.4 var(--f-sans); color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:.7rem .85rem; width:100%; resize:vertical}
.cform input:focus, .cform textarea:focus{outline:2px solid var(--brand); outline-offset:0; border-color:var(--brand)}
.cform .bad{border-color:#C2410C}
.frow{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:.9rem}
.fact{display:flex; flex-wrap:wrap; align-items:center; gap:.75rem 1rem}
.fmsg{font-size:.9rem; color:var(--muted)}
.fmsg.ok{color:var(--ok); font-weight:600}
.fmsg.err{color:#C2410C}
.hp{position:absolute; left:-9999px; width:1px; height:1px; opacity:0}
@media (max-width:620px){ .frow{grid-template-columns:minmax(0,1fr)} }
.copy{border:0; background:var(--navy); color:var(--navy-ink); font:600 .8rem/1 var(--f-sans); padding:.55rem .8rem; border-radius:8px; cursor:pointer; flex:none}

footer{padding-block:0 2.5rem; color:var(--muted); font-size:.85rem}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom, 0px)); transform:translate(-50%, 20px); background:var(--ink); color:var(--bg); padding:.7rem 1.1rem; border-radius:10px; font-weight:600; font-size:.9rem; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:70}
.toast.show{opacity:1; transform:translate(-50%, 0)}

@media (max-width:820px){
  .who, .skills, .contact{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2, minmax(0,1fr))}
}
@media (max-width:620px){
  :root{--gap:4px}
  .stage{height:clamp(360px, 105vw, 460px)}
  .strip{border-radius:7px}
  .strip .kick{display:none}
  .strip .label{font-size:.92rem; bottom:.8rem}
  .strip.active{transform:translateY(-6px)}
  .job, .edu-grid{grid-template-columns:minmax(0,1fr)}
  .job{gap:.4rem}
  .actions .txt-btn{display:none}
}
@media (prefers-reduced-motion:reduce){
  .strip, .strip img, .panel-inner, .notch, .fill{transition:none !important}
  .caret{display:none}
}
</style>

<header class="top">
  <div class="wrap">
    <div>
      <h1>Dante Gennari</h1>
      <p class="role" aria-live="polite"><span class="rot" id="rot">Gestión de proyectos logísticos SAP</span><span class="caret" aria-hidden="true"></span></p>
    </div>
    <div class="actions">
      <button class="btn icon-btn" id="theme-btn" type="button" aria-label="Cambiar tema claro u oscuro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a class="btn" href="https://www.linkedin.com/in/soydante" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4V21H3zM9.5 9.75h3.8v1.6h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.6 4.78 6V21h-4v-5c0-1.2-.02-2.75-1.68-2.75-1.68 0-1.94 1.3-1.94 2.66V21h-4z"/></svg>
        <span class="txt-btn">LinkedIn</span></a>
      <button class="btn btn-primary" type="button" data-go="contacto">Contactar</button>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="stage intro" id="stage" role="tablist" aria-label="Secciones"></nav>
  <p class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5a2 2 0 0 1 4 0v6M13 10a2 2 0 0 1 4 0v2M17 11a2 2 0 0 1 4 0v4a6 6 0 0 1-6 6h-2a6 6 0 0 1-5-2.7L5 15.5a2 2 0 0 1 3.2-2.4L9 14"/></svg>Pulsa una franja de la foto para abrir cada sección</p>
  <div class="panel-wrap">
    <div class="notch" id="notch" aria-hidden="true"></div>
    <div class="panel" id="panel" role="tabpanel" tabindex="-1"><div class="panel-inner" id="panel-inner"></div></div>
  </div>
</main>

<footer><div class="wrap">© <span id="year">2026</span> Dante Gennari · Madrid</div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

    {id:'competencias', label:'Competencias', kick:'Herramientas', title:'Herramientas e idiomas', html:function(){ return ''+
      '<div class="skills"><div>'+
        '<div class="grp"><h3>SAP y procesos de negocio</h3><ul class="chips brand"><li>Integrated Business Processes in SAP S/4HANA</li><li>SAP S/4HANA Sales</li><li>SAP S/4HANA Sourcing and Procurement</li><li>SAP Signavio</li><li>Celonis</li><li>SAP Joule</li></ul></div>'+
        '<div class="grp"><h3>Inteligencia artificial</h3><ul class="chips"><li>IA generativa aplicada a SAP</li><li>Claude</li><li>Microsoft Copilot</li><li>ChatGPT</li></ul></div>'+
      '</div><div class="langs"><h3 style="font-size:1rem;font-weight:700;margin-bottom:1rem">Idiomas</h3>'+
        [['Portugués','Nativo',100],['Castellano','Bilingüe',100],['Inglés','Avanzado',80]].map(function(l){ return '<div class="lang"><div class="row"><span>'+l[0]+'</span><span>'+l[1]+'</span></div><div class="track"><div class="fill" data-w="'+l[2]+'"></div></div></div>'; }).join('')+
      '</div></div>'; }},
    {id:'contacto', label:'Contacto', kick:'Hablemos', title:'¿Hablamos?', html:function(){ return ''+
      '<div class="contact"><form class="cform" id="cform" novalidate>'+
        '<p class="lead">Estoy abierto a oportunidades en gestión de proyectos logísticos, consultoría SAP y puestos que conecten negocio y tecnología. Escríbeme y te respondo por email.</p>'+
        '<div class="frow"><label for="f-name">Nombre<input id="f-name" name="nombre" required autocomplete="name"></label>'+
        '<label for="f-company">Empresa<input id="f-company" name="empresa" autocomplete="organization"></label></div>'+
        '<label for="f-email">Tu email<input id="f-email" name="email" type="email" required autocomplete="email"></label>'+
        '<label for="f-msg">Mensaje<textarea id="f-msg" name="mensaje" rows="4" required></textarea></label>'+
        '<input type="text" name="_honey" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">'+
        '<div class="fact"><button class="btn btn-primary" type="submit" id="f-send">Enviar mensaje</button><span class="fmsg" id="f-msg-out" role="status"></span></div>'+
      '</form>'+
      '<div class="clist">'+
        '<div class="cline"><span class="ic">'+ic('mail')+'</span><span class="t"><small>Email</small><b class="sel" id="mail">soydante@yahoo.com</b></span><button class="copy" id="copy-mail" type="button">Copiar</button></div>'+
        '<a class="cline" href="https://www.linkedin.com/in/soydante" target="_blank" rel="noopener"><span class="ic">'+LI+'</span><span class="t"><small>LinkedIn</small><b>linkedin.com/in/soydante</b></span></a>'+
        '<div class="cline"><span class="ic">'+ic('pin')+'</span><span class="t"><small>Ubicación</small><b>Madrid, España</b></span></div>'+
      '</div></div>'; }}
  ];

  /* ---------- Franjas ---------- */
  var stage = $('#stage'), N = SECTIONS.length;
  SECTIONS.forEach(function(s, i){
    var b = document.createElement('button');
    b.className = 'strip'; b.type = 'button'; b.id = 'tab-' + s.id;
    b.setAttribute('role','tab'); b.setAttribute('aria-controls','panel'); b.setAttribute('aria-selected','false');
    b.innerHTML = '<img alt="" src="'+PHOTO+'"><span class="kick">'+s.kick+'</span><span class="label">'+s.label+'</span><span class="bar"></span>';
    b.addEventListener('click', function(){ open(i, true); });
    b.addEventListener('keydown', function(e){
      var k = e.key, j = null;
      if (k === 'ArrowRight') j = (i + 1) % N; else if (k === 'ArrowLeft') j = (i - 1 + N) % N; else if (k === 'Home') j = 0; else if (k === 'End') j = N - 1;
      if (j !== null){ e.preventDefault(); open(j, false); stage.children[j].focus(); }
    });
    stage.appendChild(b);
  });
  stage.firstElementChild.querySelector('img').setAttribute('alt','Retrato de Dante Gennari');

  /* Coloca la foto completa detrás de las franjas para que cada una muestre su trozo */
  function layout(){
    var W = stage.clientWidth, H = stage.clientHeight;
    var ratio = 1435 / 1066, wide = W > 700;
    var imgW = Math.max(W, H * ratio) * (wide ? 1.35 : 1);
    var offset = (imgW - W) / 2;
    $$('.strip', stage).forEach(function(s){
      var img = s.querySelector('img');
      img.style.width = imgW + 'px';
      img.style.objectPosition = wide ? '50% 16%' : '50% 30%';
      img.style.left = -(s.offsetLeft + offset) + 'px';
    });
    placeNotch();
  }
  if ('ResizeObserver' in window) new ResizeObserver(layout).observe(stage);
  window.addEventListener('resize', layout);

  /* ---------- Panel ---------- */
  var panel = $('#panel'), inner = $('#panel-inner'), notch = $('#notch'), current = -1;
  function placeNotch(){
    if (current < 0) return;
    var s = stage.children[current];
    notch.style.left = (s.offsetLeft + s.offsetWidth / 2) + 'px';
  }
  function render(i){
    var s = SECTIONS[i];
    var prev = SECTIONS[(i - 1 + N) % N], next = SECTIONS[(i + 1) % N];
    inner.innerHTML = ''+
      '<div class="p-head"><div><span class="kicker">'+s.kick+'</span><h2>'+s.title+'</h2></div>'+
      (s.extra ? s.extra() : '<div class="pager"><button class="btn btn-sm" type="button" data-go="'+prev.id+'" aria-label="Anterior: '+prev.label+'">'+ic('left')+prev.label+'</button><button class="btn" type="button" data-go="'+next.id+'" aria-label="Siguiente: '+next.label+'">'+next.label+ic('right')+'</button></div>')+
      '</div>' + s.html();
    panel.setAttribute('aria-labelledby', 'tab-' + s.id);
    wire();
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      $$('.fill', inner).forEach(function(f){ f.style.width = f.getAttribute('data-w') + '%'; });
      $$('[data-count]', inner).forEach(count);
    }); });
  }
  function open(i, fromClick){
    if (i === current) return;
    current = i;
    stage.classList.add('has-active');
    $$('.strip', stage).forEach(function(s, j){ s.classList.toggle('active', j === i); s.setAttribute('aria-selected', j === i ? 'true' : 'false'); s.tabIndex = j === i ? 0 : -1; });
    placeNotch();
    try { history.replaceState(null, '', '#' + SECTIONS[i].id); } catch(e){}
    if (reduce || !inner.innerHTML){ render(i); }
    else { inner.classList.add('out'); setTimeout(function(){ render(i); inner.classList.remove('out'); }, 180); }
    if (fromClick){
      var r = panel.getBoundingClientRect();
      if (r.top > window.innerHeight * .75) setTimeout(function(){ panel.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block:'start' }); }, 200);
    }
  }
  function go(id, scroll){
    var i = SECTIONS.findIndex(function(s){ return s.id === id; });
    if (i < 0) return;
    open(i, false);
    if (scroll) setTimeout(function(){ panel.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block:'start' }); }, 200);
  }
  document.addEventListener('click', function(e){
    var g = e.target.closest('[data-go]');
    if (g){ go(g.getAttribute('data-go'), g.closest('.top') !== null); }
  });

  function count(el){
    var to = +el.getAttribute('data-count');
    if (reduce){ el.textContent = to; return; }
    var t0 = null;
    function step(t){ if (!t0) t0 = t; var p = Math.min(1, (t - t0) / 900); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }

  /* Controles dentro del panel */
  var toast = $('#toast'), tt;
  function show(msg){ toast.textContent = msg; toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(function(){ toast.classList.remove('show'); }, 2000); }
  function wire(){
    $$('.chip-btn', inner).forEach(function(b){
      b.addEventListener('click', function(){
        var f = b.getAttribute('data-filter');
        $$('.chip-btn', inner).forEach(function(o){ o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
        $$('.job', inner).forEach(function(j){ j.hidden = f !== 'all' && j.getAttribute('data-cat').split(' ').indexOf(f) === -1; });
      });
    });
    var form = $('#cform', inner);
    if (form) form.addEventListener('submit', function(e){
      e.preventDefault();
      var out = $('#f-msg-out', inner), btn = $('#f-send', inner);
      var name = form.nombre, mail = form.email, msg = form.mensaje, ok = true;
      [name, mail, msg].forEach(function(f){ var bad = !f.value.trim() || (f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.value.trim())); f.classList.toggle('bad', bad); if (bad) ok = false; });
      out.className = 'fmsg';
      if (!ok){ out.classList.add('err'); out.textContent = 'Completa nombre, un email válido y el mensaje.'; return; }
      if (form._honey.value) return;
      btn.disabled = true; out.textContent = 'Enviando…';
      var data = { nombre:name.value.trim(), empresa:form.empresa.value.trim(), email:mail.value.trim(), mensaje:msg.value.trim(),
                   _subject:'Nuevo contacto desde tu web: ' + name.value.trim(), _replyto:mail.value.trim(), _template:'table' };
      fetch('https://formsubmit.co/ajax/' + CONTACT_EMAIL, { method:'POST', headers:{ 'Content-Type':'application/json', 'Accept':'application/json' }, body:JSON.stringify(data) })
        .then(function(r){ return r.json().then(function(j){ if (!r.ok || String(j.success) === 'false') throw new Error(j.message || 'error'); }); })
        .then(function(){ form.reset(); out.classList.add('ok'); out.textContent = 'Mensaje enviado. Te responderé pronto.'; })
        .catch(function(){
          out.classList.add('err');
          out.textContent = 'No se pudo enviar desde aquí. Escríbeme directamente a ' + CONTACT_EMAIL + '.';
        })
        .then(function(){ btn.disabled = false; });
    });
    var cp = $('#copy-mail', inner);
    if (cp) cp.addEventListener('click', function(){
      var m = $('#mail', inner);
      function fallback(){ try{ var r = document.createRange(); r.selectNodeContents(m); var s = getSelection(); s.removeAllRanges(); s.addRange(r); show('Email seleccionado: pulsa Ctrl+C para copiarlo'); }catch(e){} }
      try { navigator.clipboard.writeText(m.textContent.trim()).then(function(){ show('Email copiado'); }, fallback); } catch(e){ fallback(); }
    });
  }

  /* Rol rotativo */
  var roles = ['Gestión de proyectos logísticos SAP','Procesos de negocio en S/4HANA','Desarrollo de aplicaciones','Comunicación y atención al cliente'];
  var rot = $('#rot');
  if (!reduce){
    var ri = 0, ch = roles[0].length, del = false;
    setTimeout(function tick(){
      if (!del){ ch++; if (ch > roles[ri].length){ del = true; return setTimeout(tick, 2200); } }
      else { ch--; if (ch === 0){ del = false; ri = (ri + 1) % roles.length; } }
      rot.textContent = roles[ri].slice(0, ch) || '​';
      setTimeout(tick, del ? 28 : 55);
    }, 2000);
  }

  /* Tema */
  var root = document.documentElement;
  try { var saved = localStorage.getItem('dg-theme'); if (saved) root.setAttribute('data-theme', saved); } catch(e){}
  $('#theme-btn').addEventListener('click', function(){
    var cur = root.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('dg-theme', next); } catch(e){}
  });

  /* Arranque: abre la sección del enlace o "Quién soy" */
  layout();
  var h = (location.hash || '').slice(1);
  var startIdx = Math.max(0, SECTIONS.findIndex(function(s){ return s.id === h; }));
  open(startIdx, false);
  window.addEventListener('hashchange', function(){ go(location.hash.slice(1), false); });
  setTimeout(function(){ stage.classList.remove('intro'); }, 1400);
  $('#year').textContent = new Date().getFullYear();
})();
</script>
